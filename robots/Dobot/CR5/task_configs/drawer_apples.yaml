# Dobot CR5 — 抽屉：开 → 抓取苹果 → 放置 → 关（队列 + skill 参数分层）
#
# - 物体清单：.meta/objects/apples.yaml、drawer.yaml
# - runtime_defaults：流程级公共字段（与 fruits.yaml 一致）
# - skill_defaults：键顺序与 task_queue 中技能出现顺序一致
# - scene_presets：drawer_002 覆盖抽屉 + 苹果 object_key
#
# 合并顺序与 motion_main / 录制一致：base 扁平化 → skill_defaults → 场景扁平 → skill_params

task_key: drawer_apples
label: 将苹果放入抽屉里
use_stamped: true
default_scene: drawer_001
# 默认抓取目标：.meta/objects/apples.yaml → apple_1
active_object: apple_1

runtime_defaults:
  max_stage_duration: 3.0
  pose_tol_pos: 0.006
  pose_tol_ori: 0.03

skill_defaults:
  # 苹果 / 柜体扰动分 id，避免 scene 覆盖 env.* 时误改柜体块
  randomize_apple:
    object_key: apple_1
    xyz_offset: [0.3, 0.3, 0.0]
  randomize_cabinet:
    object_key: cabinet
    xyz_offset: [0.05, 0.05, 0.0]

  # single_arm.drawer — 供 pull_open / close_push 合并几何（.meta/objects/drawer.yaml）
  # 朝向：compose_aligned_ee_orientation（frame=object, mode=full, aligned=0）
  # ee_base：相对旧默认 (0.5,0.5,0.5,-0.5) 绕工具 +Z 转 90°，使张合大致竖直以夹水平把手
  single_arm.drawer:
    object_key: drawer
    grasp_id: level_1
    orient_from: handle
    ee_base_orientation: [0.7071, 0.0, 0.0, -0.7071]
    ee_orientation_frame: object
    object_orientation_mode: full
    aligned_object_yaw: 0
    drawer_clearance: -0.003
    pull_distance: 0.15
    prepare_offset: [0.0, 0.0, -0.05]
    ee_retreat_offset: [0.0, 0.0, -0.05]

  single_arm.pick:
    arm: left
    pick_clearance: 0.03
    prepare_offset: [0.0, 0.0, -0.1]
    object_key: apple_1
    ee_base_orientation: [0.7, 0.7, 0.0, 0.0]
    ee_retreat_offset: [0.0, 0.0, -0.1]

  single_arm.place:
    place_position: [-0.5211657941743888, 0.18339369774887115, 0.52]
    ee_base_orientation: [0.64, 0.64, -0.28, -0.28]
    prepare_offset: [0.0, 0.0, 0.0]
    ee_retreat_offset: [0.0, 0.0, 0.0]

  # 初始关节到位（与 fruits.yaml 一致）
  movej_cr5_prep:
    left_arm_positions: [-3.14, 0.0, -1.57, 0.0, 1.57, 0.0]
    arrival_timeout: 30.0
    joint_tolerance: 0.02

task_queue:
  # - skill: env.randomize_object_local_xyz
  #   id: randomize_apple
  # - skill: env.randomize_object_local_xyz
  #   id: randomize_cabinet
  - skill: joint.movej_to_config
    id: movej_cr5_prep
  - skill: single_arm.drawer.pull_open
  - skill: single_arm.pick
  - skill: single_arm.place
  - skill: single_arm.drawer.close_push

scene_presets:
  drawer_001: {}
  drawer_002:
    active_object: apple_2
    skill_params:
      randomize_apple:
        object_key: apple_2
      single_arm.pick:
        object_key: apple_2
      single_arm.drawer:
        object_key: drawer_2
        grasp_id: level_1

record:
  base_record_overrides:
    task_name: drawer_apples
    fps: 30
    camera_info_timeout: 10.0
    enable_keypoint_pcd: false
    include_depth_feature: false
    image_writer_processes: 0
    image_writer_threads: 8
    video_encoding_batch_size: 5
  profiles:
    - key: default
      label: Default
      overrides: {}
    - key: fast
      label: Fast Encode Queue
      overrides:
        image_writer_threads: 12
        video_encoding_batch_size: 10
