# Dobot CR5 — pick / place（队列 + skill 参数分层）
#
# - runtime_defaults：仅流程级公共字段（容差等；mode 默认为 single_arm，可省略）
# - skill_defaults：与 task_queue 中 single_arm.pick / single_arm.place 对齐的默认参数
# - scene_presets：用 skill_params.single_arm.pick|place 按场景覆盖
#
# 合并顺序与 motion_main / 录制一致：base 扁平化 → skill_defaults → 场景扁平 → skill_params

task_key: pick_place
label: 把水果放在架子上
use_stamped: true
default_scene: apple
# 默认抓取目标：task_configs/.meta/objects/apple.yaml
active_object: apple

runtime_defaults:
  max_stage_duration: 3.0
  pose_tol_pos: 0.006
  pose_tol_ori: 0.03
  gripper_open: 1.0
  gripper_closed: 0.0

skill_defaults:
  env.randomize_object_local_xyz:
    object_key: apple
    xyz_offset: [0.05, 0.05, 0.0]
  single_arm.pick:
    arm: left
    # gripper_closed: 0.61
    prepare_offset: [0.0, 0.0, -0.12]
    object_key: apple
    object_position_offset: [0.00, 0.0, 0.01]
    ee_base_orientation: [1.0, 0.0, 0.0, 0.0]
    ee_retreat_offset: [0.0, 0.0, -0.1]
  single_arm.place:
    # .meta/objects/shelf.yaml；grasp_id 用 target/level_* 局部 frame 作放置点
    object_key: shelf
    grasp_id: level_2
    prepare_offset: [0.0, 0.0, -0.15]
    ee_base_orientation: [0.5, 0.5, 0.5, -0.5]
    ee_retreat_offset: [0.0, 0.0, -0.2]

  movej_cr5_return:
    left_arm_positions: [-3.14, 0.0, -1.57, 0.0, 1.57, 0.0]
    arrival_timeout: 30.0
    joint_tolerance: 0.02

task_queue:
#  - skill: env.randomize_object_local_xyz
  - skill: joint.movej_to_config
    id: movej_cr5_return
  - skill: single_arm.pick
  - skill: single_arm.place
  - skill: joint.movej_to_config
    id: movej_cr5_return

scene_presets:
  apple: {}
  lemon:
    active_object: lime
    skill_params:
      movej_cr5_return:
        left_arm_positions: [ 0, 0.0, 1.57, 0.0, -1.57, 0.0 ]
      # env.randomize_object_local_xyz:
      #   object_key: lime
      single_arm.pick:
        object_key: lime
        grasp_id: center
        # 相对物体 yaw 对齐（auto 吸附到最近 k·π/2）
        ee_orientation_frame: object
        object_orientation_mode: yaw
        aligned_object_yaw: auto
        # gripper_closed: 0.45
      single_arm.place:
        object_key: shelf
        grasp_id: level_1

record:
  base_record_overrides:
    task_name: pick_place
    fps: 30
    camera_info_timeout: 10.0
    enable_keypoint_pcd: false
    include_depth_feature: false
    image_writer_processes: 0
    image_writer_threads: 8
    video_encoding_batch_size: 5
  profiles:
    - key: default
      label: Default
      overrides: {}
    - key: fast
      label: Fast Encode Queue
      overrides:
        image_writer_threads: 12
        video_encoding_batch_size: 10
