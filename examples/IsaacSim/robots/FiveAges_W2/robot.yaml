key: fiveages_w2
label: FiveAges W2
base_link_entity_path: /World/FiveAges_W2/LinkHou_S2/base_footprint/base_link
gripper_action_wait: 2.0

ros2_stack:
  defaults:
    args:
      robot: fiveages_w2
      hardware: isaac
  motion:
    required: true
    preset: ocs2-fullbody
    # true -> launch_mode:=control_only（无 RViz）；false -> full（有 RViz）
    # 抓取联调需要 RViz 看 marker / FSM；无头再改回 true
    headless: false
    args:
      # 仿真 env/wuji_hand2_new.usda；切回 O7 时改为 linkerhand_o7 + dexhand_o7_new
      type: wuji_hand2
  navigation:
    required: auto
    package: robot_common_launch
    launch_file: navigation_isaac_gt.launch.py
    profile: default
    # true -> use_rviz:=false；false -> 启 Nav2 RViz
    headless: true
    ready_when:
      node_name_contains: [controller_server]
