task_queue:
  - skill: joint.movej_to_config
    id: init_movej
  - skill: nav.navigate_to_pose
    id: nav1
  - skill: joint.movej_to_config
    id: pre_pick_movej
  - skill: nav.navigate_to_pose
    id: nav2
  - skill: joint.movej_to_config
    id: pre_pick_movej2
  - skill: single_arm.pick
  - skill: nav.navigate_to_pose
    id: nav3
  - parallel:
      - skill: nav.navigate_to_pose
        id: nav4
      - skill: joint.movej_to_config
        id: higher_body_before_place
  - skill: single_arm.pick
    id: single_arm.pick1
  - skill: single_arm.move_relative
    id: drag_out
  - skill: joint.movej_to_config
    id: higher_body_before_place1
  - skill: single_arm.place
