# FiveAges W2 — Factory Poc 项目：双臂搬运箱子
#
# 流程：… → dual_arm.carry →（回原点 ∥ 对齐）→（降腰 ∥ 导航至放置点）→ dual_arm.place
# 参考：Factory Poc/black_box_pick.yaml（pre_pick_movej）、Bosch POC/port7_bimanual_carry.yaml

task_key: siemens_box_carry
label: Factory Poc 双臂搬箱
use_stamped: true
default_scene: default

runtime_defaults:
  base_link_entity_path: /World/robot/FiveAges_W2/LinkHou_S2/base_footprint/base_link
  max_stage_duration: 2.0
  pose_tol_pos: 0.02
  pose_tol_ori: 0.03

skill_defaults:
  nav_before_carry:
    object_prim_path: /World/simple/bg1/port1/desktop
    approach_offset_x: 0.00
    approach_offset_y: 0.8
    yaw: -1.5708
    timeout: 60.0

  nav_before_place:
    object_prim_path: /World/simple/bg1/transfer/desktop
    approach_offset_x: -0.65
    approach_offset_y: 0.55
    yaw: 0.0
    timeout: 60.0

  init_movej:
    body_positions: [-0.6, -1.2, -0.6, 0.0]
    left_arm_positions: [-0.638, 1.528, 1.562, -1.680, 0.0, -0.787, 0.0]
    right_arm_positions: [0.638, 1.528, -1.562, -1.680, 0.0, -0.787, 0.0]
    arrival_timeout: 30.0
    joint_tolerance: 0.05
    body_movej_duration: 2.0

  pre_pick_movej:
    body_positions: [-0.6, -1.6, -1.0, 0.0]
    left_arm_positions: [-0.55, 1.0266, 0.8165, -1.8487, -0.9908, -0.5437, -0.4515]
    right_arm_positions: [0.55, 1.0266, -0.8165, -1.8487, 0.9908, -0.5437, 0.4515]
    head_positions: [0.0, 0.18]
    arrival_timeout: 30.0
    joint_tolerance: 0.05
    body_movej_duration: 2.0

  dual_arm.carry:
    motion_frame_id: arm_base
    arm_movel_duration: 2.0
    object_prim_path: /World/simple/bundle/box1/box1
    object_position_offset: [0.03, 0.0, 0.235]
    object_dual_arm_half_span_y: 0.34
    arm_merge_distance_y: 0.04
    left_base_orientation: [0.7, 0.0, 0.7, 0.0]
    right_base_orientation: [0.7, 0.0, 0.7, 0.0]
    orientation_delta_rpy: [0.0, -0.436332313, 0.0]  # 在基础姿态上绕 Y 轴 -25°
    ee_lift_offset: [0.05, 0.0, 0.05]

  nav_to_origin:
    x: 0.0
    y: 0.0
    yaw: 0.0
    timeout: 60.0

  align_before_place:
    align_position: [0.55, 0.0, -0.05]
    motion_frame_id: arm_base
    arm_movel_duration: 2.0

  lower_body_before_place:
    body_positions: [-0.8, -1.6, -0.8, 0.0]
    skip_fsm_change: true
    arrival_timeout: 30.0
    joint_tolerance: 0.05
    body_movej_duration: 2.0

  dual_arm.place:
    reference_object_prim_path: /World/simple/bg1/transfer/desktop
    object_position_offset: [-0.55, 0.235, 0.05]
    motion_frame_id: arm_base
    arm_movel_duration: 2.0

task_queue:
  - skill: joint.movej_to_config
    id: init_movej
  - skill: nav.navigate_to_object
    id: nav_before_carry
  - skill: joint.movej_to_config
    id: pre_pick_movej
  - skill: dual_arm.carry
  - parallel:
      - skill: nav.navigate_to_pose
        id: nav_to_origin
      - skill: dual_arm.bimanual_align
        id: align_before_place
  - skill: nav.navigate_to_object
    id: nav_before_place
  - skill: joint.movej_to_config
    id: lower_body_before_place
  - skill: dual_arm.place

scene_presets:
  default:
    skill_params: {}

  # port2：port1 拣箱导航 → 搬 box1 → port2 放置；default 仍走 transfer
  port2:
    skill_params:
      init_movej:
        left_arm_positions: [-0.55, 1.0266, 0.8165, -1.8487, -0.9908, -0.5437, -0.4515]
        right_arm_positions: [0.55, 1.0266, -0.8165, -1.8487, 0.9908, -0.5437, 0.4515]
      pre_pick_movej:
        body_positions: [ -0.8, -1.6, -0.8, 0.0 ]
      nav_before_carry:
        object_prim_path: /World/simple/bg1/transfer/desktop
        approach_offset_x: -0.65
        approach_offset_y: 0.55
        yaw: 0
      lower_body_before_place:
        body_positions: [-0.9, -2.6, -1.7, 0.0]
      nav_before_place:
        object_prim_path: /World/simple/bg1/port2/collision/Cube
        approach_offset_x: 0.0
        approach_offset_y: -0.8
        yaw: 1.5708
      dual_arm.place:
        reference_object_prim_path: /World/simple/bg1/port2/collision/Cube
        object_position_offset: [0.0, 0.03, 0.3]

