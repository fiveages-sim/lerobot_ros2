task_key: rotate_blade
label: 在工作台旁抓取风电叶片、旋转90°后放下
use_stamped: true
default_scene: default

runtime_defaults:
  base_link_entity_path: /World/robot/FiveAges_W2/Linkhou_S2/base_footprint
  max_stage_duration: 5.0
  pose_tol_pos: 0.006
  pose_tol_ori: 0.03

skill_defaults:
  # 1) 并行：导航到 bg_1/Cube + 预抓 MoveJ
  nav_to_bg_cube:
    object_prim_path: /World/scene/bg_1/collision/Cube
    approach_offset_x: 0.0
    approach_offset_y: 1.0
    yaw: 1.5708
    timeout: 60.0

  pre_pick_movej:
    body_positions: [-1.2, -1.6, -0.8, -3.1415]
    head_positions: [0.0, 0.18]
    left_arm_positions: [-0.5, -0.4, 0.4, -1.8202, -1.5708, 0.0, 0.0]
    right_arm_positions: [0.5, -0.4, -0.4, -1.8202, 1.5708, 0.0, 0.0]
    arrival_timeout: 30.0
    joint_tolerance: 0.05
    body_movej_duration: 2.0

  # 抓取前开启身体追踪
  enable_body_tracking:
    command: [BODY_FREE]
    wait_timeout: 5.0

  # 2) 双臂同时抓起叶片
  dual_arm.parallel_pick:
    ee_orientation_frame: object
    object_orientation_mode: yaw
    aligned_object_yaw: auto
    left_pick:
      object_prim_path: /World/scene/wind_turbo_blade/turbo_blade
      object_position_offset: [-0.002694, -0.02, -0.08]
      prepare_offset: [0.0, 0.0, -0.05]
      ee_base_orientation: [0.0, 1.0, 0.0, 0.0]
      ee_retreat_offset: [0.0, 0.0, -0.075]
    right_pick:
      object_prim_path: /World/scene/wind_turbo_blade/turbo_blade
      object_position_offset: [0.48, 0.06, -0.02]
      prepare_offset: [0.0, 0.0, -0.05]
      ee_base_orientation: [0.0, 1.0, 0.0, 0.0]
      ee_retreat_offset: [0.0, 0.0, -0.075]

  # 抓取后：身体追踪 + 双臂耦合（一次确认全部 mode）
  enable_tracking_and_coupled:
    commands: [ ARMS_COUPLED]
    wait_timeout: 5.0

  # 3) 耦合下仅发左臂：绕竖直轴旋转 90°（右臂跟随）
  rotate_90:
    arm: left
    motion_frame_id: base_footprint
    position_delta: [-0.2, 0.0, 0.1]
    orientation_delta_rpy: [0.0, 1.57, 0.0]
    arm_movel_duration: 4.0
    gripper: 0.0

  # 4) 双手中点对齐 Cube+offset（物体系）→ 松爪 → 外张 → 后撤
  place_on_cube:
    reference_object_prim_path: /World/scene/bg_1/collision/Cube
    object_position_offset: [0.0, 0.3, 0.22]
    motion_frame_id: base_footprint
    arm_movel_duration: 2.0
    retreat_xyz: [0.05, 0.0, 0.1]

task_queue:
  - parallel:
      - skill: nav.navigate_to_object
        id: nav_to_bg_cube
      - skill: joint.movej_to_config
        id: pre_pick_movej
  - skill: robot.send_mode_command
    id: enable_body_tracking
  - skill: dual_arm.parallel_pick
  - skill: robot.send_mode_command
    id: enable_tracking_and_coupled
  - skill: single_arm.move_relative
    id: rotate_90
  - skill: dual_arm.place
    id: place_on_cube

scene_presets:
  default:
    skill_params: {}

  # 叶片绕竖直轴转 180°：左右抓取点沿物体系 x 对调
  angle180:
    skill_params:
      dual_arm.parallel_pick:
        left_pick:
          object_position_offset: [-0.002694, -0.028, -0.075]
        right_pick:
          object_position_offset: [0.475, -0.028, -0.075]

  angle270:
    skill_params:
      dual_arm.parallel_pick:
        left_pick:
          object_position_offset: [ -0.002694, -0.01, -0.13 ]
        right_pick:
          object_position_offset: [ 0.475, -0.023, -0.18 ]
