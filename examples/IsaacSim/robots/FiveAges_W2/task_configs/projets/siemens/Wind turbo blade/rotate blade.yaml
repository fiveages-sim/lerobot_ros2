task_key: rotate_blade
label: 在工作台旁抓取风电叶片、旋转90°后放下
use_stamped: true
default_scene: default

runtime_defaults:
  base_link_entity_path: /World/robot/FiveAges_W2/Linkhou_S2/base_footprint
  max_stage_duration: 5.0
  pose_tol_pos: 0.006
  pose_tol_ori: 0.03

# 场景物体 prim / grasps 在同目录 .meta/objects/（wind_turbo_blade、bg_cube）
# 任务只需 active_object；换 instance 时用 objects: 或 scene_presets.*.objects 覆盖
active_object: wind_turbo_blade

skill_defaults:
  # 1) 并行：导航到 bg_cube + 预抓 MoveJ
  nav_to_bg_cube:
    object_key: bg_cube
    approach_offset_x: 0.0
    approach_offset_y: 1.0
    yaw: 1.5708
    timeout: 60.0

  pre_pick_movej:
    body_positions: [-1.2, -1.6, -0.4, -3.1415]
    head_positions: [0.0, 0.18]
    left_arm_positions: [-0.5, 0.4, 0.4, -2.0, -1.5708, 0.0, 0.0]
    right_arm_positions: [0.5, 0.4, -0.4, -2.0, 1.5708, 0.0, 0.0]
    arrival_timeout: 30.0
    joint_tolerance: 0.05
    body_movej_duration: 2.0

  # 抓取前开启身体追踪
  enable_body_tracking:
    command: [BODY_FREE]
    wait_timeout: 5.0

  # 2) 双臂同时抓起叶片（offset 由 USD grasp frame 自动解析）
  dual_arm.parallel_pick:
    ee_orientation_frame: object
    object_orientation_mode: yaw
    aligned_object_yaw: auto
    left_pick:
      grasp_id: small_4
      prepare_offset: [0.0, 0.0, -0.1]
      ee_base_orientation: [0.0, 1.0, 0.0, 0.0]
      ee_retreat_offset: [0.0, 0.0, -0.075]
    right_pick:
      grasp_id: big_4
      prepare_offset: [0.0, 0.0, -0.1]
      ee_base_orientation: [0.0, 1.0, 0.0, 0.0]
      ee_retreat_offset: [0.0, 0.0, -0.075]
  # 抓取后：身体追踪 + 双臂耦合（一次确认全部 mode）
  enable_tracking_and_coupled:
    commands: [ ARMS_COUPLED]
    wait_timeout: 5.0

  # 3) 耦合下仅发左臂：绕竖直轴旋转 90°（右臂跟随）
  rotate_90:
    arm: left
    motion_frame_id: base_footprint
    position_delta: [-0.2, 0.0, 0.1]
    orientation_delta_rpy: [0.0, 1.57, 0.0]
    arm_movel_duration: 4.0
    gripper: 0.0

  # 4) 双手中点对齐 bg_cube+offset（物体系）→ 松爪 → 外张 → 后撤
  place_on_cube:
    reference_object_key: bg_cube
    object_position_offset: [0.0, 0.3, 0.2]
    motion_frame_id: base_footprint
    arm_movel_duration: 2.0
    retreat_xyz: [0.15, 0.0, 0.1]

task_queue:
  - parallel:
      - skill: nav.navigate_to_object
        id: nav_to_bg_cube
      - skill: joint.movej_to_config
        id: pre_pick_movej
  - skill: robot.send_mode_command
    id: enable_body_tracking
  - skill: dual_arm.parallel_pick
  - skill: robot.send_mode_command
    id: enable_tracking_and_coupled
  - skill: single_arm.move_relative
    id: rotate_90
  - skill: dual_arm.place
    id: place_on_cube

scene_presets:
  default:
    skill_params: {}

  # 换抓取点：覆盖 grasp_id（small_1..4 / big_1..4）
  angle180:
    skill_params:
      dual_arm.parallel_pick:
        left_pick:
          grasp_id: small_3
        right_pick:
          grasp_id: big_3
      place_on_cube:
        object_position_offset: [ 0.0, 0.3, 0.19 ]

  angle270:
    skill_params:
      dual_arm.parallel_pick:
        left_pick:
          grasp_id: small_2
        right_pick:
          grasp_id: big_2
      place_on_cube:
        object_position_offset: [ 0.0, 0.2, 0.19 ]
        retreat_xyz: [0.15, 0.0, 0.1]

  angle360:
    skill_params:
      dual_arm.parallel_pick:
        left_pick:
          grasp_id: small_1
        right_pick:
          grasp_id: big_1
