# FiveAges W2 — Factory Poc 项目：双臂抓取、旋转、放置整体流程
# 流程：第一个导航点抓取 -> 第二个导航点旋转/倒料 -> 第三个导航点放置。
# 抓取段沿用 grasp_debug.yaml 已验证的老横抓参数：左右手从两侧横向插入/夹抓。
task_key: siemens_box_carry_simple
label: Factory Poc box carry / rotate / place
# true 表示笛卡尔目标带 frame_id 发送，配合 motion_frame_id 使用，避免坐标系混淆。
use_stamped: true
# 默认 Isaac 场景名；运行命令里的 --scene default 会匹配这里。
default_scene: default

runtime_defaults:
  # 机器人底盘在 Isaac 世界里的实体路径，用于把物体世界位姿换算到机器人参考系。
  base_link_entity_path: /World/robot/FiveAges_W2/LinkHou_S2/base_footprint/base_link
  # 单个笛卡尔阶段的默认时长上限；放置闭爪平移较长，太短会没到位就进入开爪段。
  max_stage_duration: 4.0
  # 末端到目标位置的容忍度，单位米；过小会更容易报 timeout。
  pose_tol_pos: 0.02
  # 末端到目标姿态的容忍度，单位弧度。
  pose_tol_ori: 0.03

skill_defaults:
  nav_before_carry:
    # 第一个导航参考点，靠近待抓箱子的起始区域。
    object_prim_path: /World/warehouse/bg2/start
    # 导航目标 = 参考点位置 + offset；x/y 是地图/导航坐标系下的偏移，不是箱子局部坐标。
    approach_offset_x: -0.70
    approach_offset_y: -0.01
    # 机器人到达抓取点时的底盘朝向，单位弧度。
    yaw: 0.0
    timeout: 60.0

  nav_before_place:
    # 最后放置位置的导航参考点。
    object_prim_path: /World/warehouse/bg2/end
    approach_offset_x: 0.872
    approach_offset_y: 0.0
    # 约等于 180 度，让机器人面向放置工位。
    yaw: 3.1415
    timeout: 60.0

  init_movej:
    # 初始收拢/准备姿态。body_positions 是升降/躯干等 body 关节。
    body_positions: [-0.6, -1.2, -0.6, 0.0]
    # 左右臂初始关节位；左右通常是镜像关系。
    left_arm_positions: [-0.638, 1.528, 1.562, -1.680, 0.0, -0.787, 0.0]
    right_arm_positions: [0.638, 1.528, -1.562, -1.680, 0.0, -0.787, 0.0]
    # movej 到位等待时间和关节误差阈值。
    arrival_timeout: 30.0
    joint_tolerance: 0.05
    # body movej 插值时长。
    body_movej_duration: 2.0
    # false 表示本段结束后不立刻恢复 OCS2 笛卡尔控制。
    resume_ocs2: false

  pre_pick_movej:
    # 抓取前预备姿态：底盘导航到位后，身体下降、双臂摆到箱子前。
    body_positions: [-0.6, -1.6, -1.0, 0.0]
    left_arm_positions: [-0.55, 1.0266, 0.8125, -1.8487, -0.9908, -0.5437, -0.4515]
    right_arm_positions: [0.55, 1.0266, -0.8125, -1.8487, 0.9908, -0.5437, 0.4515]
    head_positions: [0.0, 0.18]
    arrival_timeout: 30.0
    joint_tolerance: 0.05
    body_movej_duration: 2.0
    resume_ocs2: false

  dual_arm.carry:
    # 抓取/搬运笛卡尔目标使用的坐标系；这里用 arm_base，调参更直观。
    motion_frame_id: arm_base
    # 沿用 grasp_debug 已验证的横抓节奏。
    arm_movel_duration: 3.0
    # test2 这套 warehouse 场景里使用的箱子路径。
    object_prim_path: /World/warehouse/bundle/box1/box1
    # 抓取中心相对箱子原点的偏移 [x, y, z]，单位米。
    object_position_offset: [-0.17, 0.0, 0.135]
    # 双臂抓取半宽；横抓时左右手沿 arm_base Y 方向展开。
    object_dual_arm_half_span_y: 0.340
    # y 横抓时的横向预张开距离；Forward 阶段外张，CloseIn 再夹进来。
    arm_merge_distance_y: 0.05
    # 竖抓备用参数；横抓模式下不作为主路径使用。
    vertical_approach_clearance_z: 0.08
    # true 表示读取箱子实时姿态；配合 object_orientation_mode 控制使用哪部分姿态。
    use_object_orientation: true
    # full = 完整使用箱子四元数；tilt = 只保留滑轨造成的 roll/pitch 倾斜，忽略约 90 度 yaw；none = 不用姿态。
    object_orientation_mode: tilt
    # 左右手位置展开参考系：
    # motion = 沿 arm_base 的 Y 轴左右展开；object = 沿箱子局部 Y 轴展开。
    object_span_frame: motion
    # y = 老横抓：左右手从两侧横向插入/夹抓。
    object_span_axis: y
    # 手腕姿态参考系：
    # motion = 使用下方固定手腕姿态；object = 固定姿态再跟随箱子姿态旋转。
    # 如果开 object 后手腕偏得很大，优先改回 motion。
    ee_orientation_frame: motion
    # 左右手基础四元数姿态 [x, y, z, w]，决定夹爪朝向。
    left_base_orientation: [0.7, 0.0, 0.7, 0.0]
    right_base_orientation: [0.7, 0.0, 0.7, 0.0]
    # 兼容老字段：当下面 lateral/vertical 没写时会用它。
    orientation_delta_rpy: [0.0, -0.436332313, 0.0]
    # object_span_axis=y 时使用：老横抓手腕姿态。
    lateral_orientation_delta_rpy: [0.0, -0.436332313, 0.0]
    # object_span_axis=x 时使用：竖直下抓手腕姿态，横抓主流程不会用到。
    vertical_orientation_delta_rpy: [0.0, -0.436332313, 1.5708]
    # auto 表示 y 横抓时 ee_lift_offset 按工具系解释，x 竖直下抓时按 arm_base/motion 系解释。
    carry_linear_displacement_frame: auto
    # 抓住后抬箱子的位移 [x, y, z]，单位米；x 模式下 z=0.1 就是真正向上抬 10cm。
    ee_lift_offset: [0.03, 0.0, 0.0]
    # 搬运全程锁死双臂间距，基础夹持宽度不变
    lock_bimanual_span: true
    # true 表示后续搬运阶段保持夹爪闭合。
    hold_gripper: true

  nav_to_origin:
    # 可选返回原点导航点，目前 task_queue 里被注释掉了。
    x: 0.0
    y: 0.0
    yaw: 0.0
    timeout: 60.0

  nav_to_release:
    # 倾倒/释放前的导航参考点。
    object_prim_path: /World/warehouse/bg2/release
    approach_offset_x: 0.112
    approach_offset_y: -0.856
    yaw: 1.5708
    timeout: 60.0

  align_before_place:
    # 抓起后、去第二个导航点前的持箱对齐。
    align_position: [0.55, 0.0, -0.05]
    motion_frame_id: arm_base
    arm_movel_duration: 2.0
    # 保持双臂相对距离和夹爪状态，避免搬运中箱子松动。
    lock_bimanual_span: true
    hold_gripper: true
    # 固定左右臂Y向跨度，回转不张开
    span_lock_offset_y: 0.327

  bimanual_lift_push:
    # 边导航边持箱向前/向上推的对齐目标，用于让箱子保持可控姿态。
    align_position: [0.8, 0.0, 0.35]
    motion_frame_id: arm_base
    arm_movel_duration: 2
    lock_bimanual_span: true
    hold_gripper: true
    span_lock_offset_y: 0.327

  pre_place_align:
    # 第三个导航点到位后，先把双臂水平粗摆到放置位上方 10cm。
    # 姿态保持第 9 步回正后的夹爪水平姿态。
    align_position: [0.45, 0.0, 0.0]
    motion_frame_id: arm_base
    arm_movel_duration: 3.0
    lock_bimanual_span: true
    hold_gripper: true
    span_lock_offset_y: 0.327

  pre_place_vertical_down:
    # 双臂保持夹紧，把双臂中点对到 Isaac 里选中的放置参考点。
    # 这样导航略有误差时，最终闭爪下放不再依赖固定 arm_base 坐标。
    reference_object_prim_path: /World/warehouse/bg2/end/viusal
    # 相对 reference_object_prim_path 的局部偏移 [x, y, z]，用于微调箱子落点。
    # z 往大调 = 放得更高；z 往小调 = 放得更低。
    object_position_offset: [0.20, 0.0, 0.20]
    motion_frame_id: arm_base
    arm_movel_duration: 2.0
    lock_bimanual_span: true
    hold_gripper: true
    span_lock_offset_y: 0.327

  lower_body_before_place:
    # 直接写腰部/body 的 4 个电机目标值：[body_joint1, body_joint2, body_joint3, body_joint4]。
    # 这里不是相对位移，想让腰再低就直接改这 4 个目标值。
    body_positions: [-1.2, -2.6, -1.4, 0.0]
    arrival_timeout: 30.0
    joint_tolerance: 0.05
    body_movej_duration: 3.0
    resume_ocs2: true

  left_arm_level_before_down:
    # 放下前单独给左臂一个小姿态修正，补偿前面碰撞导致的左右末端不水平。
    # 这里只转左臂末端，不改右臂；如果方向反了，把 pitch 的符号从 -0.08 改成 0.08。
    arm: left
    position_delta: [0.05, 0.0, 0.0]
    orientation_delta_rpy: [0.0, 0.0, 0.0]
    motion_frame_id: arm_base
    arm_movel_duration: 1.5

  dual_arm.place:
    # 前面 pre_place_vertical_down 已经按 reference 对齐；这里不再做额外闭爪平移。
    translation_xyz: [0.0, 0.0, 0.0]
    # 松爪前左右臂末端一起加的姿态增量 [roll, pitch, yaw]，单位弧度。
    orientation_delta_rpy: [0.0, 0.0, 0.0]
    # 松爪后、水平外抽前，先让右臂末端下降 2cm，避开卡住的边缘。
    post_release_right_delta_xyz: [0.0, 0.0, 0.0]
    # 再给右臂绕 y 轴微转约 2 度，避免外抽时钩住边缘。
    post_release_right_orientation_delta_rpy: [0.0, 0.0, 0.0]
    # 松爪后双臂末端水平外抽 20cm。
    spread_half: 0.00
    # 不做额外整体平移，只执行左右外抽。
    retreat_xyz: [0.0, 0.0, 0.0]
    motion_frame_id: arm_base
    arm_movel_duration: 4.0
    lock_bimanual_span: true
    hold_gripper: true
    span_lock_offset_y: 0.327

  pre_pick_stand:
    # 抓取完成后站起/过渡姿态，同时恢复 OCS2 供后续笛卡尔控制。
    body_positions: [-0.0, -0.0, -0.0, 0.0]
    head_positions: [0.0, 0.18]
    arrival_timeout: 30.0
    joint_tolerance: 0.05
    body_movej_duration: 2.0
    resume_ocs2: true

task_queue:
  # 1. 初始姿态
  - skill: joint.movej_to_config
    id: init_movej
  # 2. 第一个导航点：到箱子附近抓取
  - skill: nav.navigate_to_object
    id: nav_before_carry
  # 3. 抓取预备姿态
  - skill: joint.movej_to_config
    id: pre_pick_movej
  # 4. 老横抓：双臂从两侧插入、闭合并抬起箱子
  - skill: dual_arm.carry
  # - skill: nav.navigate_to_pose
  #   id: nav_to_origin
  # 5. 抓起后站起，并把双臂中点拉到稳定持箱位置
  - parallel:
      - skill: joint.movej_to_config
        id: pre_pick_stand
      - skill: dual_arm.bimanual_align
        id: align_before_place
  # 6. 第二个导航点：到旋转/倒料位置，同时双臂保持/推送箱子姿态
  - parallel:
      - skill: nav.navigate_to_object
        id: nav_to_release
      - skill: dual_arm.bimanual_align
        id: bimanual_lift_push
  # 7. 在第二个导航点原地翻转
  - skill: dual_arm.bimanual_align
    params:
      align_position: [0.55, 0.0, 0.02]
      motion_frame_id: arm_base
      arm_movel_duration: 5.0
      lock_bimanual_span: true
      hold_gripper: true
      span_lock_offset_y: 0.327
      orientation_delta_rpy: [0.0, 0.8, 0.0]
  # 8. 继续翻转/倒料
  - skill: dual_arm.bimanual_align
    params:
      align_position: [0.55, 0.0, 0.01]
      motion_frame_id: arm_base
      arm_movel_duration: 3.0
      lock_bimanual_span: true
      hold_gripper: true
      span_lock_offset_y: 0.327
      orientation_delta_rpy: [0.0, 1.6, 0.0]
  # 9. 回到举高持箱位置，准备去第三个导航点
  - skill: dual_arm.bimanual_align
    params:
      align_position: [0.7, 0.0, 0.15]
      motion_frame_id: arm_base
      arm_movel_duration: 4.0
      lock_bimanual_span: true
      hold_gripper: true
      span_lock_offset_y: 0.327
      orientation_delta_rpy: [0.0, -2.0, 0.0]
  # 10. 第三个导航点：到放置位置
  - skill: nav.navigate_to_object
    id: nav_before_place
  # 11. 第三个导航点到位后，先把双臂水平粗摆到放置位上方
  - skill: dual_arm.bimanual_align
    id: pre_place_align
  # 12. 直接写腰部/body 的 4 个电机目标值
  - skill: joint.movej_to_config
    id: lower_body_before_place
  # 13. 放下前单独修正左臂末端水平
  - skill: single_arm.move_relative
    id: left_arm_level_before_down
  # 14. 双臂保持夹紧，按选中的放置参考点对齐下放
  - skill: dual_arm.bimanual_align
    id: pre_place_vertical_down
  # 15. 松爪，并让双臂末端水平外抽 20cm
  - skill: dual_arm.place

scene_presets:
  default:
    # 默认场景没有额外覆盖参数；后面可按 scene 增加 skill_params 覆盖。
    skill_params: {}
