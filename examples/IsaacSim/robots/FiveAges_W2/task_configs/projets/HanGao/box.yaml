  preplace_movej:
    body_positions: [ -1.0931, -2.2044, -1.0969, 0.0015 ]
    left_arm_positions: [ 1.1754, -0.7801, -0.5725, -1.1054, 0.4831, 0.1987, 0.7500 ]
    right_arm_positions: [ -1.1343, -0.7721, 0.5333, -1.0187, -0.5127, 0.1727, -0.7698 ]
    head_positions: [ 0.0, 0.18 ]
    arrival_timeout: 30.0
    joint_tolerance: 0.05
    body_movej_duration: 2.0
    resume_ocs2: false

  place_movej:
    body_positions: [ -1.1875, -2.4085, -1.1897, -0.0002 ]
    left_arm_positions: [ 1.3174, -0.5139, -0.8472, -0.7557, 0.8114, 0.1639, 1.0388 ]
    right_arm_positions: [ -1.3957, -0.5325, 0.8708, -0.8887, -0.7935, 0.0542, -1.0476 ]
    head_positions: [ 0.0, 0.18 ]
    arrival_timeout: 30.0
    joint_tolerance: 0.05
    body_movej_duration: 2.0
    resume_ocs2: false

#==================== 任务执行队列（底盘行走+右臂摆动并行执行） ====================
task_queue:
#    最左边的物块
  - skill: joint.movej_to_config
    id: pick_movej
  - parallel:
      - skill: single_arm.move_relative
        id: drag_up_l
      - skill: single_arm.move_relative
        id: drag_up_r
  - skill: joint.movej_to_config
    id: carry_movej
  - skill: nav.navigate_to_pose
    id: nav_1
  - skill: nav.navigate_to_pose
    id: nav_13
  - skill: joint.movej_to_config
    id: preplace_movej

