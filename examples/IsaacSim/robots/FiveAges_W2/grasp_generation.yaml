# FiveAges W2 + Wuji Hand2 — grasp-generation profile (reference template).
#
# Launch (same style as motion-generation):
#   cd examples/IsaacSim
#   ros2-stack launch --robot fiveages_w2          # terminal A
#   grasp-generation                              # terminal B (interactive)
#   # or: grasp-generation serve --robot fiveages_w2 --workspace .
#
# New robot / hand:
#   1) Copy this file to robots/<YourRobot>/grasp_generation.yaml
#   2) Set robot_key, camera topics/frames, tip frames, hand_profile
#   3) Add execution profile under grasp_generation/execution/profiles/ if needed
# Does NOT replace motion-generation task queues.

# --- robot / camera -------------------------------------------------
robot_key: fiveages_w2
arm: right
motion_frame_id: base_link
base_frame: base_link

camera_frames:
  - head_camera
  - head_camera_optical_frame
  - head_link2

camera_prim: /World/FiveAges_W2/Head_V1/head_link2/head_camera/head_camera
base_prim: /World/FiveAges_W2/LinkHou_S2/base_footprint/base_link

rgb_topic: /head_camera/rgb
depth_topic: /head_camera/depth
info_topic: /head_camera/camera_info

viser_port: 8080
capture_dir: data/w2_wuji_head_capture
sampling_steps: 1
position_only: false

# --- wrist tip mapping (HUG MANO → OCS2) ----------------------------
# Hand mounts on tcp (same as O7). Use live TF; do not hardcode tip offset.
hug_tip_frame: "{arm}_tcp"
control_tip_frame: "{arm}_eef"
# MANO −X ≈ fingers; robot tip +Z ≈ fingers (Wuji / O7-compatible)
mano_to_tip_rpy_deg: [0, -90, 0]

# --- dex hand (swap hand_profile for another registered profile) ----
hand_profile: wuji_hand2
keypoint_rpy_deg: [0.0, 0.0, 0.0]
hug_mano_is_right: true
squeeze_amount: 0.5
thumb_abd_boost: 1.25

# --- close executors B0–B5 (Viser dropdown; B4 recommended) ---------
close_executor: B4
close_steps: 40
close_dt_s: 0.04
contact_hold_frames: 2
min_contact_fingers: 2
freeze_mode: keep_tip
ramp_steps: 25
ramp_amount: 0.18
tip_ramp_boost: 0.35
tip_pinch_steps: 12
tip_pinch_amount: 0.25
wrist_press_m: 0.008
wrist_press_axis: tip_neg_z
auto_retarget_on_close: true
shape_steps: 30
shape_settle_s: 0.5
shape_use_contact_gate: false
# World +Z lift before close (m). 0 = off. This file overrides package default.
pre_close_lift_m: 0

# --- contact (Isaac Wuji Sensor=contact_force) ----------------------
contact_topic_prefix: ""
always_log_contact: true
object_frame: ""
object_push_warn_m: 0.08
arrival_timeout: 8.0
execute_default: false

# --- privileged auto-grasp (wuji_hand2_new.usda table props; hardcoded) -----
# Later: restore dynamic discovery from scene / .meta/objects. Do not edit USDA.
# pose_prim = rigid body (read pose / UV). placement_prim = payload root (write xform).
# home_* = authored local xform (placement units; SimReady scale=100 — NOT meters).
# click_offset = [x,y,z] meters in pose_prim LOCAL frame (HUG purple marker).
#   Tune with dry_run_auto: raise Z if purple sits on the table junction;
#   nudge X/Y if it sits on the rim instead of the grasp face. Restart serve after edit.
default_object_key: apple
grasp_objects:
  apple:
    pose_prim: /World/default_environment/EastRural_Table/sm_apple_a01_01/Geometry/model_normalized_0_vis_obj
    placement_prim: /World/default_environment/EastRural_Table/sm_apple_a01_01
    home_translate: [-2.68086663011519, -21.085257324728257, 94.49615662815259]
    home_orient_wxyz: [1.0, 0.0, 0.0, 0.0]
    click_offset: [0.0, 0.0, 0.035]
  banana:
    pose_prim: /World/default_environment/EastRural_Table/banana/banana/banana
    placement_prim: /World/default_environment/EastRural_Table/banana
    home_translate: [14.259275860209584, 2.552130180273554, 90.0]
    home_orient_wxyz: [0.9238795, 0.0, 0.0, 0.38268352]
    click_offset: [0.0, 0.0, 0.025]
  bottle:
    pose_prim: /World/default_environment/EastRural_Table/sm_food_beverage_beerBottle_a01_01/Geometry/sm_food_beverage_beerBottle_a01_obj_00
    placement_prim: /World/default_environment/EastRural_Table/sm_food_beverage_beerBottle_a01_01
    home_translate: [-4.664164226313403, 22.33081319072058, 80.18630475677222]
    home_orient_wxyz: [1.0, 0.0, 0.0, 0.0]
    click_offset: [0.0, 0.0, 0.10]
  lime:
    pose_prim: /World/default_environment/EastRural_Table/sm_food_produce_lime_a02_01/Geometry/lime_01_obj_00
    placement_prim: /World/default_environment/EastRural_Table/sm_food_produce_lime_a02_01
    home_translate: [-17.996991901701342, -4.093611474105462, 82.0]
    home_orient_wxyz: [1.0, 0.0, 0.0, 0.0]
    click_offset: [0.0, 0.0, 0.03]
  hammer:
    pose_prim: /World/default_environment/EastRural_Table/sm_handTool_hammer_crossPeen_b01_01
    placement_prim: /World/default_environment/EastRural_Table/sm_handTool_hammer_crossPeen_b01_01
    home_translate: [7.555667981277196, -12.70905201772507, 83.0802559117363]
    home_orient_wxyz: [1.0, 0.0, 0.0, 0.0]
    click_offset: [0.0, 0.0, 0.04]

# Scene prep: STOP→PLAY → write XY+yaw (keep live Z) → STOP→PLAY (heal PhysX).
# Final STOP→PLAY is required or getDof*Targets invalidates / arm freezes.
# keep_live_z=true = do not slam yaml home Z (avoids mid-air drop+roll).
# near_yaw_deg = ± yaw about placement local Z.
scene_prep:
  settle_s: 1.5
  restore_after: false
  isolate_mode: exile
  near_spawn: true
  keep_live_z: true
  near_yaw_deg: 30.0
  near_xy_min: [-12.0, -32.0]
  near_xy_max: [8.0, -10.0]
  exile_xy_base: [120.0, 120.0]
  exile_spacing: 30.0

# Go home = FSM_HOME then dual-EE +Z lift (grasp home ≠ raw controller home).
home_settle_s: 10.0
grasp_home_lift_m: 0.1

# Auto: after close, wait for fingers to settle, then lift EE +Z to verify grasp.
post_grasp_lift: true
post_grasp_lift_m: 0.30
post_grasp_settle_s: 7.0
