# FiveAges W2 — grasp-generation (HUG → wrist follow). Does not replace ros2-stack.
# Used by: grasp-generation serve --robot fiveages_w2
#
# Prerequisite:
#   Isaac: FaSim .../W2/env/wuji_hand2_new.usda (Play)
#   ros2-stack launch --robot fiveages_w2   # motion type:=wuji_hand2

robot_key: fiveages_w2
arm: right
motion_frame_id: base_link
base_frame: base_link

camera_frames:
  - head_camera
  - head_camera_optical_frame
  - head_link2

camera_prim: /World/FiveAges_W2/Head_V1/head_link2/head_camera/head_camera
base_prim: /World/FiveAges_W2/LinkHou_S2/base_footprint/base_link

rgb_topic: /head_camera/rgb
depth_topic: /head_camera/depth
info_topic: /head_camera/camera_info

viser_port: 8080
capture_dir: data/w2_wuji_head_capture
sampling_steps: 1
position_only: false
# Hand mounts on tcp (same as O7). Current Wuji assembly: palm/finger +Z aligned with
# tcp like O7; eef offset differs (hand_base→eef ≈ +0.07 Z) — use live TF, do not hardcode.
# Tip frames follow selected arm (Viser dropdown left|right)
hug_tip_frame: "{arm}_tcp"
control_tip_frame: "{arm}_eef"
# MANO −X ≈ fingers; robot tip +Z ≈ fingers (Wuji hand_base / O7-compatible)
mano_to_tip_rpy_deg: [0, -90, 0]
# Phase 2B: fingers via wuji-sdk; HUG MANO is right — same q can drive left controller
hand_profile: wuji_hand2
keypoint_rpy_deg: [0.0, 0.0, 0.0]
hug_mano_is_right: true
# Amplify retarget curl (keep shape; deepen inward). UI slider = this gain.
squeeze_amount: 0.5
thumb_abd_boost: 1.25
arrival_timeout: 8.0
execute_default: false
