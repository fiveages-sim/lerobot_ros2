# FiveAges W2 + Wuji Hand2 — grasp-generation profile (reference template).
#
# Launch (same style as motion-generation):
#   cd examples/IsaacSim
#   ros2-stack launch --robot fiveages_w2          # terminal A
#   grasp-generation                              # terminal B (interactive)
#   # or: grasp-generation serve --robot fiveages_w2 --workspace .
#
# New robot / hand:
#   1) Copy this file to robots/<YourRobot>/grasp_generation.yaml
#   2) Set robot_key, camera topics/frames, tip frames, hand_profile
#   3) Add execution profile under grasp_generation/execution/profiles/ if needed
# Does NOT replace motion-generation task queues.

# --- robot / camera -------------------------------------------------
robot_key: fiveages_w2
arm: right
motion_frame_id: base_link
base_frame: base_link

camera_frames:
  - head_camera
  - head_camera_optical_frame
  - head_link2

camera_prim: /World/FiveAges_W2/Head_V1/head_link2/head_camera/head_camera
# Same articulation root as robot.yaml base_link_entity_path (FaSim W2).
base_prim: /World/FiveAges_W2/base_link

# Head camera (W2 sensors.usda / ros2.usda after remote merge). Do not hardcode K:
# capture reads width, height, and intrinsics from camera_info.
#   RenderProduct 1280×800, focalLength 18.147562
#   aperture 38.92176 × 24.48137 → FOV ≈ 94°×68°
#   clipping 0.05–30 m
# HUG still center-crops to a square and resizes to 224; K is scaled with that crop.
rgb_topic: /head_camera/rgb
depth_topic: /head_camera/depth
info_topic: /head_camera/camera_info

viser_port: 8080
capture_dir: data/w2_wuji_head_capture
sampling_steps: 1
position_only: false

# --- wrist tip mapping (HUG MANO → OCS2) ----------------------------
# Hand mounts on tcp (same as O7). Use live TF; do not hardcode tip offset.
hug_tip_frame: "{arm}_tcp"
control_tip_frame: "{arm}_eef"
# MANO −X ≈ fingers; robot tip +Z ≈ fingers (Wuji / O7-compatible)
mano_to_tip_rpy_deg: [0, -90, 0]

# --- dex hand (swap hand_profile for another registered profile) ----
hand_profile: wuji_hand2
keypoint_rpy_deg: [0.0, 0.0, 0.0]
hug_mano_is_right: true
# B4 goal amplification (not B2 open-loop squeeze). Used as q_goal for gate/ramp.
squeeze_amount: 0.5
thumb_abd_boost: 1.25
# Only scales B2 after shape. B3–B5 ignore this (see runner.py).
post_shape_squeeze_scale: 1.0

# --- close executors B0–B5 (Viser dropdown; B4 = gate + ramp + tip_pinch) ---
close_executor: B4
close_steps: 40
close_dt_s: 0.04
contact_hold_frames: 2
min_contact_fingers: 2
freeze_mode: keep_tip
# Classic B4 CoorGrasp-lite (restored). Soft-stop aborts further curl if force high.
ramp_steps: 25
ramp_amount: 0.18
tip_ramp_boost: 0.35
tip_pinch_steps: 12
tip_pinch_amount: 0.25
# Abort approach/ramp/pinch when peak contact force ≥ this (N). Prevents open pulse.
soft_stop_force_n: 15.0
wrist_press_m: 0.008
wrist_press_axis: tip_neg_z
auto_retarget_on_close: true
shape_steps: 30
shape_settle_s: 0.5
shape_use_contact_gate: false
# World +Z lift before close (m). 0 = off. This file overrides package default.
pre_close_lift_m: 0
# Stage settles: keep hands fully open (home_1) until shape/retarget.
# Aligns with 运控 RViz: OCS2 → Open Hand → wrist → only then close.
fsm_hand_settle_s: 0.3
hand_open_settle_s: 0.6
post_wrist_settle_s: 0.5
pre_shape_settle_s: 0.3
# After close: re-send closed q before lift (no extra squeeze toward goal).
post_close_firm_s: 2.0

# --- contact (hand asset publishes this; B3–B5 only) ---------------
# Reference hand: FaSim Wuji Hand2 Sensor=contact_force → /wuji_rh/*.
# Open-loop B0–B2 and motion-generation do not need these topics.
# Scene-specific ignore tokens stay in this yaml. See docs/ENV_AND_HAND_CONTRACT.md.
contact_topic_prefix: ""
always_log_contact: true
# Desk/ground only. Props are under default_environment/EastRural_Table/sm_* —
# listing those tokens would discard apple/bottle and leave B3/B4 unfrozen.
ignore_contact_partners:
  - ground
  - GroundPlane
  - defaultGroundPlane
  - TableTop
  - floor
object_frame: ""
object_push_warn_m: 0.08
arrival_timeout: 8.0
execute_default: false

# --- privileged auto-grasp (wuji_hand2_new.usda table props; hardcoded) -----
# Objects stay on the authored table — no exile / scene clear.
# pose_prim = rigid body (read pose / UV fallback). placement_prim = payload root.
# home_* = optional authored table-local xform notes (SimReady scale=100; not written at runtime).
# click_prim = optional Stage Xform (e.g. Grasp_Point_1_1) for stable HUG purple.
# click_offset = [x,y,z] meters in click_prim (or pose_prim) LOCAL frame.
default_object_key: apple
grasp_objects:
  apple:
    pose_prim: /World/default_environment/EastRural_Table/sm_apple_a01_01/Geometry/model_normalized_0_vis_obj
    placement_prim: /World/default_environment/EastRural_Table/sm_apple_a01_01
    home_translate: [-2.680866630116711, -23.096873533936876, 79.18205717527044]
    home_orient_wxyz: [1.0, 0.0, 0.0, 0.0]
    click_offset: [0.0, 0.0, 0.035]
  banana:
    pose_prim: /World/default_environment/EastRural_Table/banana/banana/banana
    placement_prim: /World/default_environment/EastRural_Table/banana
    home_translate: [14.259275860208135, 2.5521301802735468, 77.85504755346572]
    home_orient_wxyz: [0.9238795, 0.0, 0.0, 0.38268352]
    click_offset: [0.0, 0.0, 0.025]
  bottle:
    pose_prim: /World/default_environment/EastRural_Table/sm_food_beverage_beerBottle_a01_01/Geometry/sm_food_beverage_beerBottle_a01_obj_00
    placement_prim: /World/default_environment/EastRural_Table/sm_food_beverage_beerBottle_a01_01
    home_translate: [-26.49001, 14.2035, 76.51261]
    home_orient_wxyz: [1.0, 0.0, 0.0, 0.0]
    click_prim: /World/default_environment/EastRural_Table/sm_food_beverage_beerBottle_a01_01/Grasp_Point_1_1
    click_offset: [0.0, 0.0, 0.0]
  lime:
    pose_prim: /World/default_environment/EastRural_Table/sm_food_produce_lime_a02_01/Geometry/lime_01_obj_00
    placement_prim: /World/default_environment/EastRural_Table/sm_food_produce_lime_a02_01
    home_translate: [-17.996991901701342, -4.093611474105462, 75.85155163048181]
    home_orient_wxyz: [1.0, 0.0, 0.0, 0.0]
    click_offset: [0.0, 0.0, 0.03]
  hammer:
    pose_prim: /World/default_environment/EastRural_Table/sm_handTool_hammer_crossPeen_b01_01
    placement_prim: /World/default_environment/EastRural_Table/sm_handTool_hammer_crossPeen_b01_01
    home_translate: [7.555667981274354, -12.70905201772507, 76.30829108428735]
    home_orient_wxyz: [1.0, 0.0, 0.0, 0.0]
    click_offset: [0.0, 0.0, 0.04]

# Go home = FSM_HOME then dual-EE +Z lift (grasp home ≠ raw controller home).
home_settle_s: 10.0
grasp_home_lift_m: 0.1

# Auto: firm-up → settle (hold closed q) → lift EE +Z.
# Idle without hold caused yield-open; soft_stop@8N without ramp caused loose lift.
post_grasp_lift: true
post_grasp_lift_m: 0.30
post_grasp_settle_s: 3.0
