# Unitree G1D + Dex1 — 右手侧抓试管（完整）
#
# 坐标系约定（与 robot.yaml 配合）：
#   - 任务位姿按 ee_target_frame（{arm}_eef = 夹指）书写，下发前用实时 TF
#     换成运控跟踪的 {arm}_tcp；不要在这里写死 eef↔tcp 偏移。
#   - runtime_defaults.frame_id=world：抓取/放置在 world 下解算并 stamp；
#     胸前交接等「相对身体」的路点用 base_footprint。
#   - grasp_id 走 /get_prim_attribute 读 USD 静态局部 xform，再叠加刚体
#     实时位姿（/get_entity_state）。该服务需 OmniGraph 的
#     isaacsim.ros2.bridge.ROS2ServicePrim 节点，isaacsim.ros2.sim_control
#     不提供。
#
# 下方的 ee_base_orientation / 位置来自 2026-11-01 旧基座系标定，改为
# world + eef 语义后仅作起始值，需在仿真里重新验证。

task_key: pick_tube_full
label: 右手侧抓试管（完整）
use_stamped: true
default_scene: default

runtime_defaults:
  # 物体抓取/放置在 world 下解算并 stamp（全身控制会挪底盘；base_footprint 绝对点会漂）。
  # 胸前交接等「相对身体」路点仍用 base_footprint（见下方 move_to_pose）。
  # USD /World/G1D/base_link ≡ TF base_footprint；TF base_link 高 +0.1114（机体系路点才相关）。
  base_link_entity_path: /World/G1D/base_link
  frame_id: world
  max_stage_duration: 8.0
  pose_tol_pos: 0.02
  pose_tol_ori: 0.08
  gripper_open: 1.0
  gripper_closed: 0.0

task_queue:
  # 0) 每集采集前抖动试管架局部 XY（勿改孔号；ACT 要学的是架位变化，不是 hole_i→hole_j）。
  #    必须放在 reset 后、运动技能之前（runner 约定）。半幅先 ±5cm，稳定后再加大。
  #    enabled: false 可临时关掉随机化做对照。
  - skill: env.randomize_object_local_xyz
    id: randomize_pick_rack
  - skill: env.randomize_object_local_xyz
    id: randomize_place_rack
  # 1) 锁底盘：全程不需要 WBC 挪底盘，采集到的末端轨迹才可复现。
  #    BASE_LOCK 在 mobile_base_tcp 下把 u_base 约束为 0，不改变 MPC 维度。
  - skill: robot.send_mode_command
    params:
      commands: [BASE_LOCK]
      require_confirmed: true
      wait_timeout: 5.0
  # 2) 抓取前关闭全身控制左臂。须先双臂独立，否则耦合状态下 LEFT_ARM_DISABLE 会被忽略。
  - skill: robot.send_mode_command
    params:
      commands: [LEFT_ARM_DISABLE]
  # 1) 斜向下 30° 抓取：先到准备点再闭合。水平靠近会碰到木架。
  #    world 系下相对原 base 标定绕竖直轴转了 180°：夹指 +Z 指向世界 −X 再下倾 30°。
  #    prepare_offset 在工具系：沿 −Z 退 5cm，避免低位直插撞到试管架。
  #    grasp_id → USD tube_grasp 静态局部 + 刚体实时位姿；目标 stamp 为 world。
  - skill: single_arm.pick
    params:
      arm: right
      object_key: test_tube
      grasp_id: tube
      motion_frame_id: world
      ee_base_orientation: [0.0, -0.866025, 0.0, 0.5]
      ee_pick_axis: "+z"
      ee_orientation_frame: motion
      prepare_offset: [0.0, 0.0, -0.05]
      pick_clearance: 0.0
      retreat_open_gripper: false
      gripper_closed: 0.0
      # movel_duration 是控制器节点全局参数，设一次后持续生效；
      # 0.1 = 交给 OCS2 自动延长规划时间。后续块不再重复设置。
      arm_movel_duration: 0.1
  # 2) 沿世界竖直抬起（勿用 base_footprint：躯干/底盘一动 +Z 会往前偏）。
  - skill: single_arm.move_relative
    params:
      arm: right
      motion_frame_id: world
      position_delta: [0.0, 0.0, 0.20]
      gripper: 0.0
  # 3) 交接前：打开左臂，并锁定底盘（胸前交接用 base_footprint，底盘一动点就漂）。
  - skill: robot.send_mode_command
    params:
      commands: [LEFT_ARM_ENABLE, BASE_LOCK]
      require_confirmed: true
      wait_timeout: 5.0
  # 4) 左臂 enable + 底盘锁定确认后再等 0.1s，右手把试管送到胸前。
  #    夹指朝向是抓取方向再绕世界 Z 转 +60°，仍下倾 30°。
  #    胸前位姿相对身体，用 base_footprint；底盘已 LOCK，不会在交接中被 WBC 挪走。
  - skill: single_arm.move_to_pose
    start_delay_s: 0.1
    params:
      arm: right
      motion_frame_id: base_footprint
      position: [0.38, 0.0, 1.05]
      orientation: [-0.75, -0.433013, -0.433013, 0.25]
      gripper: 0.0
  # 5) 左手按实时试管位姿抓偏上（勿写死胸前绝对点）。
  #    tube_grasp 局部 z≈0.131；再 −0.03 → 只比右手低约 3cm（原先 −0.07 太低，放置行程过大）。
  #    姿态仍下倾 15°，工具系 −Z 退 12cm 再闭合。省略 ee_lift_offset。stamp=base_footprint。
  - skill: single_arm.pick
    params:
      arm: left
      object_key: test_tube
      grasp_id: tube
      object_position_offset: [0.0, 0.0, -0.03]
      motion_frame_id: base_footprint
      ee_base_orientation: [0.687064, -0.396676, 0.527203, 0.30438]
      ee_pick_axis: "+z"
      ee_orientation_frame: motion
      prepare_offset: [0.0, 0.0, -0.12]
      pick_clearance: 0.0
      retreat_open_gripper: false
      gripper_closed: 0.0
  # 6) 左手闭爪后再等 1.5s 夹稳，右手才松开，再沿夹爪 −Z 退出 12cm。
  - skill: single_arm.move_to_pose
    params:
      arm: right
      motion_frame_id: base_footprint
      position: [0.38, 0.0, 1.05]
      orientation: [-0.75, -0.433013, -0.433013, 0.25]
      gripper: 1.0
  - skill: single_arm.move_to_pose
    params:
      arm: right
      motion_frame_id: base_footprint
      position: [0.328, -0.09, 1.11]
      orientation: [-0.75, -0.433013, -0.433013, 0.25]
      gripper: 1.0
  # 7) 放置前：右手收到与左手同一前后、同一高度（胸前 x=0.38，再低 3cm），仍在身体右侧。同时把 60° 转回去。
  #    左手停在原处，同样把 60° 转回去（夹指朝前、仍下倾 15°）。
  - parallel:
      - skill: single_arm.move_to_pose
        params:
          arm: right
          motion_frame_id: base_footprint
          position: [0.38, -0.17, 1.02]
          orientation: [0.866025, 0.0, 0.5, 0.0]
          gripper: 1.0
      - skill: single_arm.move_relative
        params:
          arm: left
          motion_frame_id: base_footprint
          position_delta: [0.0, 0.0, 0.0]
          orientation_delta_rpy: [0.0, 0.0, 1.047198]
          gripper: 0.0
  # 8) 交接完成：关掉右臂，再左手放置。
  #    【锁底盘】原为 [BASE_UNLOCK, RIGHT_ARM_DISABLE]，原注释写"放置在 world，
  #    允许 WBC 挪底盘够远处孔位"。交付要求底盘全程不动，故改为不解锁。
  #    若要恢复原行为，把 commands 改回 [BASE_UNLOCK, RIGHT_ARM_DISABLE]。
  - skill: robot.send_mode_command
    params:
      commands: [RIGHT_ARM_DISABLE]
      require_confirmed: true
      wait_timeout: 5.0
  # 9) 左手把试管放进左侧架子 hole_3（要换孔改成 hole_4）。
  #     insert_axis 由目标物体（试管架）的局部轴计算，"-z" 表示沿架体 −Z 向下插入；
  #     align_orientation（默认开）会先把试管轴摆到与插入轴对齐（保留绕轴 yaw），
  #     再重算 EE 位置使管底落在孔口。
  #     顺序：接近 → AlignHole → 重测管底并补偿 → FineAlign → 下探 insert_depth → 松爪 → 沿轴退出。
  #     手中物体：刚体实时位姿 + USD tube_bottom 局部偏移；不走 replay。
  - skill: single_arm.insert
    params:
      arm: left
      # Place rack (left). Do not rely on skill_defaults.single_arm.pick.object_prim_path
      # (that pins the tube for reset); object_key must win so hole_N is under the rack.
      object_key: test_tube_rack
      object_prim_path: /World/room/scene/test_tube_rack
      grasp_id: hole_3
      insert_axis: "-z"
      # 比原 0.06 抬高 1cm，避免夹爪下探时撞到架子。
      insert_depth: 0.05
      # 悬停高度（管子在空中纠偏的位置，沿插入轴反方向退这么多）。
      # 0.10 → 0.05：10cm 时管子离孔口太远、视觉上"悬在半空"，5cm 足够留出纠偏
      # 空间又贴近孔口。
      approach_distance: 0.05
      held_object_key: test_tube
      held_grasp_id: bottom
      live_align_compensate: true
      # 把精确对齐提前到「仍悬空」时完成：
      #   默认(False) 是 Approach→AlignHole 先下到孔口（管底已压架面），
      #   再测偏差→FineAlign→下探，纠偏发生在接触之后，靠撞孔边反复调，慢且不稳。
      #   置 true 后只悬停到孔口上方，在空中测偏差、一次性修正 XY，再垂直下探。
      hover_compensate: true
      max_align_corr: 0.03
      motion_frame_id: world
      # 插入段到位容差。实测「试管在孔正中时距孔沿约 2mm」，即单侧余量 2mm；
      # 取 1.5mm 留 0.5mm 安全余量 —— 既能穿过，又不必像 0.3mm 那样等 MPC 磨到位。
      # 整个 insert 只有 AlignAbove 一步做这个判定（见 single_arm.py 的 hover 分支），
      # 下探/松爪/退出都跳过到达判定，所以这里收紧不会拖慢整体节奏。
      pose_tol_pos: 0.0015
      pose_tol_ori: 0.02
      # 松爪后沿插入轴（架体 -Z）反向退出 8cm
      retreat_distance: 0.08
      gripper_open: 1.0
  # 10) 插入完成后左臂抬起收尾：insert 的 retreat 只沿插入轴（竖直）退 8cm，
  #     完成后夹爪仍贴在架面上方很近的位置。这里再垂直抬 15cm 让手臂离开工件，
  #     便于观察/录屏，也为后续动作留出空间。
  #     motion_frame_id 用 world（底盘全程锁定，world 与 base 等价且不受躯干抖动影响）；
  #     gripper: 1.0 保持张开，避免带着残余夹持力刮到试管。
  - skill: single_arm.move_relative
    params:
      arm: left
      motion_frame_id: world
      position_delta: [0.0, 0.0, 0.15]
      gripper: 1.0

# Needed by examples/IsaacSim/inference.py for sim reset (object_key alone is not enough).
skill_defaults:
  # 右架取管 / 左架放管：局部平移均匀抖动（Z 默认 0，避免架腿离地）。
  # 试管是独立动态刚体（非架的 USD 子节点）。只抖架子会把管留在原处或撞飞；
  # seat_* 用 G1D/room.usda 作者态下 tube−rack_01 的父系平移，把管重新坐回孔内，
  # 并顺带修正 STOP→PLAY 接触爆炸弹到桌面的情况。
  randomize_pick_rack:
    object_key: test_tube_rack_01
    xyz_offset: [0.05, 0.05, 0.0]
    seat_object_key: test_tube
    # tube_local - rack_01_local from env/G1D/room.usda overlays
    seat_translate_offset: [0.009929, -0.020547, 0.060713]
    # Must stay false: G1D ROS2ServicePrim runs on OnPlaybackTick; PAUSE kills
    # /set_prim_attribute. Teleport uses /set_entity_state while Playing.
    pause_during_move: false
    settle_after_s: 1.0
    enabled: true
  randomize_place_rack:
    object_key: test_tube_rack
    xyz_offset: [0.05, 0.05, 0.0]
    enabled: true
  single_arm.pick:
    object_prim_path: /World/room/scene/test_tube

scene_presets:
  # Default place target = hole_3 (matches task_queue insert grasp_id).
  default: {}
  # Optional place-hole scenes: auto-collect / CLI can pass --scene place_hole_N.
  place_hole_1:
    skill_params:
      single_arm.insert:
        grasp_id: hole_1
  place_hole_2:
    skill_params:
      single_arm.insert:
        grasp_id: hole_2
  place_hole_3:
    skill_params:
      single_arm.insert:
        grasp_id: hole_3
  place_hole_4:
    skill_params:
      single_arm.insert:
        grasp_id: hole_4
  place_hole_5:
    skill_params:
      single_arm.insert:
        grasp_id: hole_5
  place_hole_6:
    skill_params:
      single_arm.insert:
        grasp_id: hole_6

