# Unitree G1D + Dex1 — 右手侧抓试管（完整）
#
# 坐标系约定（与 robot.yaml 配合）：
#   - 任务位姿按 ee_target_frame（{arm}_eef = 夹指）书写，下发前用实时 TF
#     换成运控跟踪的 {arm}_tcp；不要在这里写死 eef↔tcp 偏移。
#   - runtime_defaults.frame_id=world：抓取/放置在 world 下解算并 stamp；
#     胸前交接等「相对身体」的路点用 base_footprint。
#   - grasp_id 走 /get_prim_attribute 读 USD 静态局部 xform，再叠加刚体
#     实时位姿（/get_entity_state）。该服务需 OmniGraph 的
#     isaacsim.ros2.bridge.ROS2ServicePrim 节点，isaacsim.ros2.sim_control
#     不提供。
#
# 下方的 ee_base_orientation / 位置来自 2026-11-01 旧基座系标定，改为
# world + eef 语义后仅作起始值，需在仿真里重新验证。

task_key: pick_tube_full
label: 右手侧抓试管（完整）
use_stamped: true
default_scene: default

runtime_defaults:
  # 物体抓取/放置在 world 下解算并 stamp（全身控制会挪底盘；base_footprint 绝对点会漂）。
  # 胸前交接等「相对身体」路点仍用 base_footprint（见下方 move_to_pose）。
  # USD /World/G1D/base_link ≡ TF base_footprint；TF base_link 高 +0.1114（机体系路点才相关）。
  base_link_entity_path: /World/G1D/base_link
  frame_id: world
  # 单个 stage 的最长等待时间（秒）。超时不报错，只打 WARN 后继续往下走。
  #
  # 【为什么从 8.0 降到 3.0】
  #   实测每个 stage 都耗满 8 秒才放行 —— 但动作其实早就完成了：
  #   从采集数据看左手抬手段帧 730 就停稳（z 恒定），之后 3 秒完全不动，
  #   编排却在等「到位判定」到 8 秒超时。
  #
  #   原因：判定是 pos_dist < pose_tol_pos(0.02)，而运控有约 10mm 的
  #   **稳态误差**（pos_dist 稳定在 0.0100~0.0101）—— 卡在阈值边缘，
  #   能不能过看运气，过不了就耗满超时。
  #
  #   3.0 的依据：抬手 12cm 实测约 0.6~1.0s 规划 + 1s 执行 ≈ 2s 完成，
  #   留 1s 余量。若某段动作确实更久，只会在日志多一条 WARN，不影响结果
  #   （MPC 仍在跟踪目标，后面 HOME 会把它收回去）。
  max_stage_duration: 3.0
  pose_tol_pos: 0.02
  pose_tol_ori: 0.08
  gripper_open: 1.0
  gripper_closed: 0.0

task_queue:
  # 0) 锁底盘：全程不需要 WBC 挪底盘，采集到的末端轨迹才可复现。
  #    BASE_LOCK 在 mobile_base_tcp 下把 u_base 约束为 0，不改变 MPC 维度。
  - skill: robot.send_mode_command
    params:
      commands: [BASE_LOCK]
      require_confirmed: true
      wait_timeout: 5.0
  # 1) 抓取前关闭全身控制左臂。须先双臂独立，否则耦合状态下 LEFT_ARM_DISABLE 会被忽略。
  - skill: robot.send_mode_command
    params:
      commands: [LEFT_ARM_DISABLE]
  # 1) 斜向下 30° 抓取：先到准备点再闭合。水平靠近会碰到木架。
  #    world 系下相对原 base 标定绕竖直轴转了 180°：夹指 +Z 指向世界 −X 再下倾 30°。
  #    prepare_offset 在工具系：沿 −Z 退 5cm，避免低位直插撞到试管架。
  #    grasp_id → USD tube_grasp 静态局部 + 刚体实时位姿；目标 stamp 为 world。
  - skill: single_arm.pick
    params:
      arm: right
      object_key: test_tube
      grasp_id: tube
      motion_frame_id: world
      ee_base_orientation: [0.0, -0.866025, 0.0, 0.5]
      ee_pick_axis: "+z"
      ee_orientation_frame: motion
      prepare_offset: [0.0, 0.0, -0.05]
      pick_clearance: 0.0
      retreat_open_gripper: false
      gripper_closed: 0.0
      # movel_duration 是控制器节点全局参数，设一次后持续生效；
      # 0.1 = 交给 OCS2 自动延长规划时间。后续块不再重复设置。
      arm_movel_duration: 0.1
  # 2) 沿世界竖直抬起（勿用 base_footprint：躯干/底盘一动 +Z 会往前偏）。
  - skill: single_arm.move_relative
    params:
      arm: right
      motion_frame_id: world
      position_delta: [0.0, 0.0, 0.20]
      gripper: 0.0
  # 3) 交接前：打开左臂，并锁定底盘（胸前交接用 base_footprint，底盘一动点就漂）。
  - skill: robot.send_mode_command
    params:
      commands: [LEFT_ARM_ENABLE, BASE_LOCK]
      require_confirmed: true
      wait_timeout: 5.0
  # 4) 左臂 enable + 底盘锁定确认后再等 0.1s，右手把试管送到胸前。
  #    夹指朝向是抓取方向再绕世界 Z 转 +60°，仍下倾 30°。
  #    胸前位姿相对身体，用 base_footprint；底盘已 LOCK，不会在交接中被 WBC 挪走。
  - skill: single_arm.move_to_pose
    start_delay_s: 0.1
    params:
      arm: right
      motion_frame_id: base_footprint
      position: [0.38, 0.0, 1.05]
      orientation: [-0.75, -0.433013, -0.433013, 0.25]
      gripper: 0.0
  # 5) 左手按实时试管位姿抓偏上（勿写死胸前绝对点）。
  #    tube_grasp 局部 z≈0.131；再 −0.03 → 只比右手低约 3cm（原先 −0.07 太低，放置行程过大）。
  #    姿态仍下倾 15°，工具系 −Z 退 12cm 再闭合。省略 ee_lift_offset。stamp=base_footprint。
  - skill: single_arm.pick
    params:
      arm: left
      object_key: test_tube
      grasp_id: tube
      object_position_offset: [0.0, 0.0, -0.03]
      motion_frame_id: base_footprint
      ee_base_orientation: [0.687064, -0.396676, 0.527203, 0.30438]
      ee_pick_axis: "+z"
      ee_orientation_frame: motion
      prepare_offset: [0.0, 0.0, -0.12]
      pick_clearance: 0.0
      retreat_open_gripper: false
      gripper_closed: 0.0
  # 6) 左手闭爪后再等 1.5s 夹稳，右手才松开，再沿夹爪 −Z 退出 12cm。
  - skill: single_arm.move_to_pose
    params:
      arm: right
      motion_frame_id: base_footprint
      position: [0.38, 0.0, 1.05]
      orientation: [-0.75, -0.433013, -0.433013, 0.25]
      gripper: 1.0
  - skill: single_arm.move_to_pose
    params:
      arm: right
      motion_frame_id: base_footprint
      position: [0.328, -0.09, 1.11]
      orientation: [-0.75, -0.433013, -0.433013, 0.25]
      gripper: 1.0
  # 7) 放置前：右手收到与左手同一前后、同一高度（胸前 x=0.38，再低 3cm），仍在身体右侧。同时把 60° 转回去。
  #    左手停在原处，同样把 60° 转回去（夹指朝前、仍下倾 15°）。
  - parallel:
      - skill: single_arm.move_to_pose
        params:
          arm: right
          motion_frame_id: base_footprint
          position: [0.38, -0.17, 1.02]
          orientation: [0.866025, 0.0, 0.5, 0.0]
          gripper: 1.0
      - skill: single_arm.move_relative
        params:
          arm: left
          motion_frame_id: base_footprint
          position_delta: [0.0, 0.0, 0.0]
          orientation_delta_rpy: [0.0, 0.0, 1.047198]
          gripper: 0.0
  # 8) 交接完成：关掉右臂，再左手放置。
  #    【锁底盘】原为 [BASE_UNLOCK, RIGHT_ARM_DISABLE]，原注释写"放置在 world，
  #    允许 WBC 挪底盘够远处孔位"。交付要求底盘全程不动，故改为不解锁。
  #    若要恢复原行为，把 commands 改回 [BASE_UNLOCK, RIGHT_ARM_DISABLE]。
  - skill: robot.send_mode_command
    params:
      commands: [RIGHT_ARM_DISABLE]
      require_confirmed: true
      wait_timeout: 5.0
  # 9) 左手把试管放进左侧架子 hole_3（要换孔改成 hole_4）。
  #     insert_axis 由目标物体（试管架）的局部轴计算，"-z" 表示沿架体 −Z 向下插入；
  #     align_orientation（默认开）会先把试管轴摆到与插入轴对齐（保留绕轴 yaw），
  #     再重算 EE 位置使管底落在孔口。
  #     顺序：接近 → AlignHole → 重测管底并补偿 → FineAlign → 下探 insert_depth → 松爪 → 沿轴退出。
  #     手中物体：刚体实时位姿 + USD tube_bottom 局部偏移；不走 replay。
  - skill: single_arm.insert
    params:
      arm: left
      object_key: test_tube_rack
      grasp_id: hole_3
      insert_axis: "-z"
      # 比原 0.06 抬高 1cm，避免夹爪下探时撞到架子。
      insert_depth: 0.05
      # 悬停高度（管子在空中纠偏的位置，沿插入轴反方向退这么多）。
      # 0.10 → 0.05：10cm 时管子离孔口太远、视觉上"悬在半空"，5cm 足够留出纠偏
      # 空间又贴近孔口。
      approach_distance: 0.05
      held_object_key: test_tube
      held_grasp_id: bottom
      live_align_compensate: true
      # 把精确对齐提前到「仍悬空」时完成：
      #   默认(False) 是 Approach→AlignHole 先下到孔口（管底已压架面），
      #   再测偏差→FineAlign→下探，纠偏发生在接触之后，靠撞孔边反复调，慢且不稳。
      #   置 true 后只悬停到孔口上方，在空中测偏差、一次性修正 XY，再垂直下探。
      hover_compensate: true
      max_align_corr: 0.03
      motion_frame_id: world
      # 插入段到位容差。
      #
      # 【为什么删掉 pose_tol_pos: 0.0015 —— 踩过的坑】
      #   本意是「插入更精确，取 1.5mm」，但实际完全没起作用，反而害了后面：
      #
      #   1) hover_compensate=true 时，insert 的**所有** stage 都是
      #      skip_arrival=True（见 single_arm.py 的 hover 分支），
      #      根本不做到达判定 —— 精度来自 hover 阶段的 corr_xy 补偿
      #      (把实测偏差算进目标)，不是靠等 MPC 收敛到 1.5mm。
      #   2) 但 skill_insert 末尾有 ctx.task_cfg = replace(..., common=qt.common)
      #      会把含 0.0015 的 common **写回全局 ctx.task_cfg**。
      #   3) 于是下一步 move_relative 用 ctx.task_cfg.common 做到位判定：
      #      pos_dist=0.0101 > 0.0015 → 永远判不到 → 耗满 8s 超时。
      #
      #   所以这个参数是「无用 + 有害」。删掉，用 runtime_defaults 的 0.02。
      #   实测：hover 补偿后的插入精度 xy=2~15mm，与设不设这个值无关。
      #
      # 若要恢复：只在下探段确实需要到位判定时才加（当前 hover 分支全部
      # skip_arrival，加了也不生效）。加之前先确认 ctx.task_cfg 不会被污染。
      pose_tol_ori: 0.02
      # 松爪后沿插入轴（架体 -Z）反向退出 8cm
      retreat_distance: 0.08
      gripper_open: 1.0
  # 10) 插入后先竖直抬一段再回 HOME —— **必须保留，否则会拖拽试管架**。
  #
  # 为什么不能直接回 HOME（实测 run_43 失败）：
  #   insert 的 retreat 只沿**插入轴**退 8cm（架体 -Z 方向，即竖直向上）。
  #   但夹爪是从侧面夹住试管的，退出 8cm 后夹爪仍在试管正上方很近处；
  #   此时若直接切 HOME，手臂向内收的轨迹会**扫过试管架**，把管子撞歪：
  #   实测 run_43 末帧 tilt=35.8°、dxy=57.4mm（试管被拖出孔并歪倒）。
  #
  #   即使跑"成功"的 run_42 也有轻微拖拽：帧 700→760 试管相对架子移动
  #   约 2mm（19.0,8.5)→(19.7,6.6)，只是没脱离孔所以没被发现。
  #
  # 为什么之前删掉这步时很慢（8 秒超时）—— **真因不是 movel_duration**：
  #
  #   实测日志: move_relative timeout pos_dist=0.0101 elapsed=8.05s
  #   而 pose_tol_pos=0.02 —— 0.0101 < 0.02 本该判"到达"！
  #
  #   bug 在上游: 上一步 insert 的 params 里写了 pose_tol_pos: 0.0015
  #   （为了让插入更精确），而 skill_insert 末尾有一句
  #       ctx.task_cfg = replace(ctx.task_cfg, common=qt.common, ...)
  #   把含 0.0015 的 common **写回了全局 ctx.task_cfg**。
  #   于是后面的 move_relative 也拿 0.0015 做到位判定：
  #       pos_dist=0.0101 > 0.0015  →  永远判不到  →  耗满 8s 超时。
  #
  # 修法：把 runtime_defaults.max_stage_duration 从 8.0 降到 3.0（见文件开头），
  #       让"等到位"最多等 3 秒就放行。实测动作本身 2 秒内完成。
  #
  #   注：move_relative **不读** params 里的 pose_tol_pos（只有 pick/place/
  #   insert 的 overlay 会用它），所以在这里写 pose_tol_pos 是无效的 ——
  #   之前试过，仍耗满 8 秒。真正起作用的是 max_stage_duration。
  - skill: single_arm.move_relative
    params:
      arm: left
      motion_frame_id: world
      position_delta: [0.0, 0.0, 0.12]
      gripper: 1.0
      # 让 OCS2 用 0.6s 规划这段（比默认慢速规划更快动起来）
      arm_movel_duration: 0.6
  # 11) 归位 + 收尾：回 HOME，再切 HOLD。
  #
  # 为什么用 FSM HOME 而不是发关节目标（踩过）：
  #   `joint.goto_cached_joints` 要按名字把位置数组映射成 WBC 消息，依赖
  #   `config.joint_names`；该配置的默认值是占位符（left_joint1..7），
  #   未显式配置时会发到错误关节 —— 实测 `joint arrival timeout,
  #   left_err=0.225, right_err=0.927`，机器人根本没归位。
  #
  #   对多数数采机器人，任务起始姿态就是 HOME 位（G1D 已确认），所以
  #   「切 HOME」等价于「回到可开始下一轮的状态」，只涉及状态机切换，
  #   没有任何关节映射/到位判定的风险。
  #
  # `then: HOLD` 保证每次任务结束时 FSM 都是 HOLD —— 下一轮（或人工重跑）
  # 的起始状态完全一致，自动化采集循环依赖这一点。
  #
  # 技能实现：submodules/robot_action_composer/.../skills/session.py
  # 的 `skill_fsm_command`（本地改动，未提交子模块）。
  - skill: robot.fsm_command
    params:
      state: HOME
      then: HOLD
      settle_time: 0.3
      # HOME 是异步插值（home_duration 默认 5.0s，实测日志显示 5.0s）。
      # /fsm_state 在插值**一开始**就报 HOME，所以「确认到位」不等于「动作完成」。
      # 必须额外等插值结束再切 HOLD，否则机器人刚往 home 走就停了。
      motion_wait: 6.0
      wait_timeout: 10.0

scene_presets:
  default: {}
